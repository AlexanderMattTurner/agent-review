version: 2

# Only track a handful of npm packages for version updates.
# Security updates for all packages are handled separately by
# GitHub's Dependabot security alerts (enabled at the repo level).
#
# "Watch everything" generates weekly churn that maintainers tend to
# rubber-stamp, undermining the security goal. Default to security-only
# monitoring with explicit opt-in for packages you actively care about.

updates:
  # A composite action's own `uses:` pins live in `.github/actions/*/action.yaml`
  # and drift silently under a `/` entry alone, since that scans only
  # `.github/workflows`. The glob covers every action directory, including
  # ones added later.
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # The Claude Code CLI pin that .github/scripts/install-claude-cli.sh and
  # .github/reviewer/install-claude-cli.sh read. Its own package.json, outside
  # the pnpm workspace, so a bump touches nothing else.
  - package-ecosystem: "npm"
    directory: "/.github/claude-cli"
    schedule:
      interval: "weekly"
    allow:
      - dependency-name: "@anthropic-ai/claude-code"
    cooldown:
      default-days: 2
