name: Review hand-off smoke

# This repo's own review runs under pull_request_target, so it runs MAIN's
# review.yaml and never the PR's. Nothing else runs the hand-off from a read
# leg to the post job, so a layout change there merges unexercised.
#
# This runs that hand-off for real: each leg stages a stub review with
# stage-leg-review.sh and uploads it as review.yaml's read job does, and each
# fold downloads it as review.yaml's post job does, then runs
# merge-shard-reviews.mjs and checks what it folded. The upload and download
# `with:` blocks mirror review.yaml's; only the artifact prefix gains the case
# name, so the three cases can share one run.
on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  decide:
    permissions:
      contents: read # the reusable gate checks out the tree
      pull-requests: read # its live draft re-read (decide_pr_is_draft_now)
      actions: read # its memo shadow lists this workflow's past runs (needed in a private fork)
    uses: ./.github/workflows/decide-reusable.yaml
    with:
      # POSIX ERE, read by `grep -E` — no PCRE escapes (\d, \w, (?:…)).
      paths-regex: '^\.github/(workflows/(review|review-handoff-smoke)\.yaml$|reviewer/(merge-shard-reviews|lib-review-cost|lib-cli-args)\.mjs$|reviewer/stage-leg-review\.sh$|scripts/review-handoff-smoke\.sh$)'
      memoize-anchor-jobs: "^(legs|fold)"

  legs:
    name: Stage and upload a read leg (${{ matrix.case }} / ${{ matrix.leg }})
    needs: decide
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        include:
          - { case: one, leg: whole }
          - { case: two, leg: shard-a }
          - { case: two, leg: shard-b }
          - { case: partial, leg: shard-a }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage a stub review
        env:
          LEG: ${{ matrix.leg }}
        run: bash .github/scripts/review-handoff-smoke.sh leg "${LEG}"

      - name: Upload it as review.yaml's read job does
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.case }}-pr-review-findings-${{ matrix.leg }}
          path: ${{ runner.temp }}/leg-out
          retention-days: 1
          overwrite: true

  fold:
    name: Download and fold the legs (${{ matrix.case }})
    needs: [decide, legs]
    if: needs.decide.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        case: [one, two, partial]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Download the legs as review.yaml's post job does
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ matrix.case }}-pr-review-findings-*
          path: ${{ runner.temp }}/read-legs
          merge-multiple: true

      - name: Fold them and check the result
        env:
          CASE: ${{ matrix.case }}
        run: bash .github/scripts/review-handoff-smoke.sh fold "${CASE}"

  review-handoff-smoke-passed: # required-check: true
    if: always()
    needs: [decide, legs, fold]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            .github/actions/report-job-result
          persist-credentials: false

      - name: Report result
        uses: ./.github/actions/report-job-result
        with:
          run: ${{ needs.decide.outputs.run }}
          decide-result: ${{ needs.decide.result }}
          result: ${{ needs.fold.result }}
