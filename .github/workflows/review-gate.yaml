name: Review gate

# The merge gate for the automated reviewer, as a STATUS CHECK rather than a
# review verdict. Auto-merge waits for required checks; it does not wait for a
# review that has not been submitted yet, so a PR whose cheap checks go green in
# ninety seconds merges before the reviewer has read it.
#
# This job CALLS the exported gate (review-findings-gate.yaml), which owns the
# predicate, the pagination, the retry ladder, the 140-character status budget
# and the skip set. Its header explains each.
#
# A DISMISSED review counts as a read there, because a dismissal retracts a HOLD
# and not the reading. The unresolved finding threads are the merge lever, and a
# dismissal moves none of them. The stand-in approval auto-approve-skipped-pr.sh
# posts clears the gate for the same reason a real review does: it is a review
# by the reviewer, so the threads decide.
#
# The skip set is left EMPTY: this repository's reviewer reads every pull
# request (see review.yaml's decide job), so nothing is waived and the gate
# waits for a real read.
#
# SECURITY — `pull_request_target` runs in the base repo's context. No
# PR-authored code is checked out or executed: the export clones its own
# repository at the ref below and reads the caller's severity SSOT off the
# default branch.
#
# WHICH BRANCH'S COPY OF THIS FILE RUNS differs per trigger. GitHub documents
# that `pull_request_target` "will only trigger a workflow run if the workflow
# file exists on the default branch", so that leg stays silent until this file
# merges. It states no such rule for `pull_request_review`, whose documented
# `GITHUB_REF` is the PR merge ref `refs/pull/:prNumber/merge`, so that leg runs
# the pull request's own copy and fires immediately.
on: # zizmor: ignore[dangerous-triggers] — no PR code executes: API-only scripts off a pinned clone and a default-branch checkout
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  # A HUMAN submitting or dismissing a review flips the predicate. The reviewer's
  # own review cannot arrive this way: it posts with the workflow GITHUB_TOKEN,
  # whose events start no workflow run, so the reviewer re-posts this verdict
  # itself through claude-review.yaml's `post-review-command`.
  pull_request_review:
    types: [submitted, dismissed]
  # A new review comment can open a gating thread, and resolution fires no event
  # at all — the twice-hourly sweep is what clears a resolved-only head.
  pull_request_review_comment:
    types: [created]

# Queue, never cancel, and keyed PER HEAD — the same key the called job uses.
# Never cancel because the called job posts a commit status, and a cancel
# between reading the state and POSTing leaves the head carrying a stale
# verdict on a REQUIRED context.
#
# Per head because webhook delivery is unordered and this OUTER group is
# evaluated before the called workflow's own. Under a per-branch key, a
# late-delivered event for an old head joins the same group as a queued run for
# the CURRENT head and displaces it, and the new head then gets no verdict at
# all — the inner per-head group cannot undo a cancellation that already
# happened out here.
concurrency:
  group: review-gate-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  # No job-level `if:`. This job posts a required check, so every run that can
  # occupy the concurrency slot must post a verdict itself — a conditionally
  # skipped run could displace a queued evaluation and then post nothing,
  # leaving the head with a stale status or none at all.
  review-posted:
    # The job name MUST NOT be the required-check context. This job's own check
    # run lands on the PR head under its name, and the job succeeds whenever it
    # managed to post a verdict — including a RED one. Sharing the name would put
    # a green check run and a red status under one required context, and the
    # green would satisfy it: a merge gate that reports an unresolved finding and
    # lets the merge through anyway. The context is registered instead by the
    # never-firing job in review-gate-context.yaml.
    name: Evaluate the automated-review gate # required-check: false  # this job reports whether the EVALUATION ran; the gate itself is the status it posts
    permissions:
      contents: read # the export sparse-checks-out the severity SSOT
      statuses: write # post the verdict on the head
      pull-requests: write # read the threads, free the re-check label
    uses: ./.github/workflows/review-findings-gate.yaml
    with:
      reviewer-repository: ${{ github.repository }}
      # The DEFAULT BRANCH, not `github.sha`. Under pull_request_target those
      # are the same commit, but this workflow also fires on the review events,
      # where GITHUB_REF is the pull request MERGE ref (`refs/pull/N/merge`) and
      # `github.sha` is that merge commit. The export clones with `git clone`,
      # which fetches `refs/heads/*` and `refs/tags/*` only, so the merge commit
      # is absent and `checkout --detach` dies with "reference is not a tree".
      # A branch name resolves under every trigger and stays trusted.
      reviewer-ref: ${{ github.event.repository.default_branch }}
      # BYTE-IDENTICAL to the `name:` of the job in review-gate-context.yaml:
      # that job name is what sync-required-checks registers as the ruleset's
      # required context, and the status posted here has to carry the same
      # context or the head never satisfies it.
      status-context: Automated review posted
      # `failure`, not `pending`: a pending status does not appear in `gh pr
      # checks` at all, so a reader cannot tell "the reviewer has not spoken"
      # from "no gate here at all". Both block the required context.
      unreviewed-state: failure
