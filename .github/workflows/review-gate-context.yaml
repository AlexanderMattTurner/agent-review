name: Review gate (context)

# Registers the required-check CONTEXT name, and nothing else.
#
# `sync-required-checks` derives the ruleset's required contexts from the `name:`
# of every job carrying `# required-check: true`. The gate's verdict, though, is a
# COMMIT STATUS posted by review-gate.yaml — a status has no job to annotate, so
# some job somewhere has to carry the name.
#
# It cannot be the job that posts the status. That job's own check run lands on
# the PR head under its name, and it succeeds whenever it managed to post a
# verdict — including a RED one. Sharing the name would put a green check run and
# a red status under one required context, and the green would satisfy it: a gate
# reporting an unresolved finding while the merge goes through. So the name lives
# here, on a job that CANNOT run on a pull request.
#
# `merge_group` is the trigger precisely because this repo has no merge queue, so
# the job never runs and reports nothing that could compete with the status. A
# consumer who turns a merge queue on gets the same predicate evaluated on the
# queue's own sha for free, which is where the check would otherwise be missing.

on:
  merge_group:

permissions: {}

jobs:
  review-posted:
    # BYTE-IDENTICAL to `gate_context` in config/review-severities.json, which
    # is where the gate script reads the context it posts under. YAML cannot
    # read a file, so this name and the two `status-context:` inputs are the
    # only literals left; renaming one alone leaves every PR waiting on a
    # context nothing reports.
    name: Automated review posted # required-check: true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # sparse-checkout the trusted gate script, compare the batch
      pull-requests: read # read the PRs' reviews and each commit's pull requests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The DEFAULT BRANCH, never the queued commit: the batch under test
          # carries pull-request code, and the gate that judges it must not come
          # from that code.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # review-findings-gate.sh sources the shared review-thread, review
          # and skip-set libraries and reads the severity SSOT, so every one
          # must land in the same sparse checkout; without one the script dies
          # at its `source` line, or at the `jq` that reads the severities,
          # under `set -e`.
          sparse-checkout: |
            .github/reviewer/merge-group-gate.sh
            .github/reviewer/merge-group-prs.sh
            .github/reviewer/review-findings-gate.sh
            .github/reviewer/lib/review-threads.bash
            .github/reviewer/lib/pr-reviews.bash
            .github/reviewer/lib/review-markers.bash
            .github/reviewer/lib/shared-names.json
            .github/reviewer/lib/review-skip-set.bash
            .github/reviewer/lib-ci-retry.sh
            config/review-severities.json
          sparse-checkout-cone-mode: false

      - name: Evaluate the gate for every pull request in the batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          # Through the environment, never spliced into the script body: a
          # `${{ }}` expansion inside `run:` is textual substitution, so a ref
          # carrying shell metacharacters would execute as code.
          MG_REF: ${{ github.event.merge_group.head_ref }}
          MG_HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          # The BASE BRANCH, never merge_group.base_sha: under batching that
          # field is the previous queue entry (see merge-group-prs.sh).
          MG_BASE_REF: ${{ github.event.merge_group.base_ref }}
          # No MAX_DELTA_REVIEWS_PER_PR: the gate reads `max_delta_reviews_per_pr`
          # from the severity config, which review-gate.yaml's leg reads too, so
          # the queue cannot red a pull request its own head gate let in.
          SEVERITY_CONFIG: config/review-severities.json
        # One evaluation per pull request in the batch; red on any red one.
        run: bash .github/reviewer/merge-group-gate.sh
