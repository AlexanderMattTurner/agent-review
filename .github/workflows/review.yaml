# Read ONE pull request with Anthropic's `code-review` plugin, run through
# `anthropics/claude-code-action`, and post the findings as one GitHub review. A
# diff too large for one context is split per file, each slice is read by its own
# leg of the `read` matrix, and `post` folds the legs into that one review.
# Called by a consumer repository's own workflow; every script it runs comes from
# THIS repository at the commit the caller pinned on its `uses:` line, never from
# the repository under review.
#
# ── Trust model ───────────────────────────────────────────────────────────────
#
# The caller fires on `pull_request_target`, so these jobs hold the base
# repository's secrets while a fork's pull request is what triggered them. Three
# rules keep that safe, and every job below holds all three:
#   1. The checkout is the caller's DEFAULT BRANCH, from the event payload GitHub
#      writes — never the untrusted PR head, and never the author-chosen base.
#      Nothing requires a PR to target the default branch, so a `base.ref`
#      checkout would run branch A's rewritten machinery while PR B's own diff
#      stays clean.
#   2. The PR's changes are read only as DATA, through `gh pr diff` in `prepare`,
#      and they pass the agent-sanitizer before the agent sees them. The agent
#      has no shell and no network tool, so it cannot fetch them past the
#      sanitizer.
#   3. Least privilege per job. `read`, the only job that runs a model, holds
#      `contents: read` alone and posts nothing, in every matrix leg. `post` and
#      `gate` hold the write scopes and run no model.
# A successful prompt injection can shape the findings `post` turns into a
# review; it cannot push code, merge, or reach any other scope.
name: Claude PR review (reusable)

on:
  workflow_call:
    inputs:
      reviewer-repository:
        description: "owner/name of the repository that ships this reviewer. It is cloned at the sha below, so the reviewed repository cannot rewrite the code that reviews it."
        required: true
        type: string
      reviewer-ref:
        description: "Branch, tag or commit of reviewer-repository to run. PASS IT. A caller in another repository passes the same sha its `uses:` line pins; a caller in this repository passes its own `github.sha`. The fallback reads `github.job_workflow_sha`, which is empty in the expression context, so an unset input stops the run at the clone step."
        required: false
        default: ""
        type: string
      model:
        description: "The top model: it runs the review session, the two bug reviewers and the validators that confirm their findings. A PR gets few reads and they gate the merge, so this is not a place to economize."
        required: false
        default: "opus"
        type: string
      model-low:
        description: "The helper model for the plugin's lighter agents: the CLAUDE.md file search, the change summary, the two CLAUDE.md compliance reviewers and the validators of their findings. Empty uses `sonnet`, the plugin's own choice."
        required: false
        default: ""
        type: string
      review-prompt:
        description: "Repo-relative path IN THE CALLING repository to the review instructions. Empty uses this reviewer's vendored copy of the code-review plugin's command, prompts/code-review.md. A file named here REPLACES that prompt and misses every later change to it; to add your tree's conventions, pass `extra-instructions` instead. The findings schema still binds a replacement."
        required: false
        default: ""
        type: string
      extra-instructions:
        description: "Repo-relative path IN THE CALLING repository to review instructions the reviewer follows AFTER its prompt (this reviewer's own, or `review-prompt`'s). Use it to add your tree's conventions without forking the whole prompt; where the two conflict, these win. Empty adds none. A path that names no file stops the read before it spends a credential."
        required: false
        default: ""
        type: string
      review-label:
        description: "The label that asks for a review on a pull request the CALLER's own `if:` skips — a low-risk title, a bot author. The caller must also list `labeled` in its `pull_request_target` types, or GitHub fires no run for the label."
        required: false
        default: "needs-auto-review"
        type: string
      reads-marked-from:
        description: "RFC3339 timestamp of the moment THIS caller started running a reviewer that stamps a review as a whole-diff read. Every review older than it counts as a read although it carries no stamp, so bumping your pin does not hand each already-reviewed pull request a fresh budget and a second paid read on its next push. Set it to a moment after the last review your older reviewer posted. Empty trusts the stamp alone. Remove it once no open pull request predates the date."
        required: false
        default: ""
        type: string
      max-reviews-per-pr:
        description: "How many whole-diff reads one pull request may spend, across its whole life, from 0 to 999. A run that finds the diff too large to read spends one too — it still paid for the job, and counting it is what stops an oversized pull request re-running on every push. It bounds the AUTOMATIC arms only: the `[opus-review]` head-commit opt-in and the review label fire whatever the count says, though a read either posts still counts against it. 0 leaves a pull request with no automatic read at all, so only those two arms review it — do NOT pair 0 with the review-findings gate, which then holds every pull request until somebody adds the label."
        required: false
        default: 1
        type: number
      max-delta-reviews-per-pr:
        description: "How many ACCUMULATED reads one pull request may spend, from 0 to 999. An accumulated read covers the pushes that landed after the last review, and only once the pull request is otherwise ready to merge. It is a separate budget because the automatic first-read arms fire on `synchronize`, which is what an accumulated read must not do. 0 turns the accumulated read off, and the pushes after a review then stay unread — the merge gate says so rather than claiming coverage."
        required: false
        default: 1
        type: number
      pr-number:
        description: "The pull request to read on a `workflow_dispatch` run, which carries no pull request payload. Empty (the default) is every other trigger, where the event names the pull request. `dispatch-delta-review.sh` passes it when it asks for the accumulated read."
        required: false
        default: ""
        type: string
      setup-command:
        description: "Command run in the caller's base checkout before the diff is elided, before the model call, and before the post-review command — a dependency sync a later step needs (the log redactor's interpreter, for one). Empty runs nothing."
        required: false
        default: ""
        type: string
      setup-cache-path:
        description: "Paths for `actions/cache` to restore before the setup command runs, one per line. Empty caches nothing. A setup command that downloads a pinned toolchain on every run should name the directory it installs into."
        required: false
        default: ""
        type: string
      setup-cache-key-files:
        description: "A `hashFiles` pattern naming the file that carries the pinned version, in the caller's checkout. This workflow hashes it into the cache key, so a version bump refreshes the entry instead of restoring the old binary. The caller cannot compute this itself: a called job's `with:` allows neither `hashFiles` nor `runner`. Empty caches nothing."
        required: false
        default: ""
        type: string
      elide-command:
        description: 'Command line in the caller''s base checkout that rewrites the RAW diff IN PLACE, dropping generated output no review can act on. It runs as `bash -c "<command>" -- <diff>`, so the diff is `$1` and your own quoting survives. Empty reviews the whole diff. The reviewer''s budget is diff lines, so a repository whose diffs are mostly build artifacts should name one.'
        required: false
        default: ""
        type: string
      post-review-command:
        description: "Command in the caller's base checkout, run after the review lands, with GH_TOKEN/GH_REPO/PR/REPORT_SHA in the environment. The review posts with the workflow GITHUB_TOKEN, whose events fire no workflows, so a merge gate that reads the review must be re-evaluated here or it never sees it. Empty runs nothing."
        required: false
        default: ""
        type: string
      log-redactor:
        description: "Repo-relative path in the CALLING repository to a redactor for the agent's execution log, called as `<python> <redactor> --in <log> --out <dir> --mode auto --hooks-dir <caller>/.claude/hooks --repo-root <caller>`. EMPTY PUBLISHES NO LOGS: an agent transcript carries whatever the diff exposed it to, so the absence of a redactor fails closed rather than uploading it raw."
        required: false
        default: ""
        type: string
      log-redactor-python:
        description: "Interpreter that can import the redactor's engine, relative to the caller's checkout or absolute. Defaults to the system python3."
        required: false
        default: "python3"
        type: string
      max-diff-lines:
        description: "The single-context cap. A diff line costs about 13.6 tokens, so 12000 lines is roughly 163k tokens against a 200k window. Above it the read shards."
        required: false
        default: 12000
        type: number
      shard-max-lines:
        description: "Lines per shard. The legs run in parallel, so the review's wall clock is one leg's read; a smaller shard trades that for a finding likelier to fall across a boundary. A shard never splits a file."
        required: false
        default: 4000
        type: number
      max-shardable-lines:
        description: "The largest diff that is sharded at all. Above it, or when the diff needs more than max-shardable-lines / shard-max-lines shards, the PR gets a human-review notice and no automated read."
        required: false
        default: 192000
        type: number
      review-timeout-seconds:
        description: "Wall clock ONE credential attempt may spend on the read, rounded up to whole minutes."
        required: false
        default: 1500
        type: number
    secrets:
      rung_1:
        description: "First-tier Claude Code OAuth token; empty skips the first attempt."
        required: false
      rung_2:
        description: "Second-tier token; empty skips the second attempt."
        required: false
      rung_3:
        description: "Third-tier token; empty skips the third attempt."
        required: false
      rung_4:
        description: "Fourth-tier token; empty skips the fourth attempt."
        required: false
      rung_5:
        description: "Fifth-tier token; empty skips the fifth attempt."
        required: false
      rung_6:
        description: "Sixth-tier token; empty skips the sixth attempt."
        required: false
      rung_7:
        description: "Seventh-tier token; empty skips the seventh attempt."
        required: false
      rung_8:
        description: "Eighth-tier credential; empty skips the eighth attempt. A metered Anthropic API key in ANY rung is optional, and the review tries it only after every subscription token has failed."
        required: false

permissions: {}

jobs:
  # Decide whether to review. EVERY PR is reviewed — no skip by title, author or
  # draft state — so a bot-authored or machine-cut release PR gets a genuine read
  # rather than an unread rubber-stamp. The script then decides `opened` (always —
  # GitHub fires it once per PR) against `ready_for_review` and `synchronize`,
  # which both repeat without limit and so review only while the PR has spent
  # fewer than `max-reviews-per-pr` reads, or when the [opus-review] head-commit
  # opt-in buys another.
  decide:
    name: Decide whether to review
    # A dispatch names its pull request in `pr-number`, because a
    # `workflow_dispatch` run carries no pull request payload at all.
    if: github.event_name == 'pull_request_target' || inputs.pr-number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      # Reads the reviews already on the PR, which is what tells the script how
      # many of the automatic reads this PR has already spent.
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
      # True only for the never-reviewed trigger, whose read can race a review
      # that is still generating; prepare re-asks the question from inside the
      # concurrency group.
      recheck: ${{ steps.decide.outputs.recheck }}
      # Which pull request, which head, and which budget pays — written by the one
      # script that decided them, so no later job re-derives them from an event
      # payload a dispatch run has not got.
      pr: ${{ steps.decide.outputs.pr }}
      head_sha: ${{ steps.decide.outputs.head_sha }}
      read: ${{ steps.decide.outputs.read }}
      since: ${{ steps.decide.outputs.since }}
    steps:
      # No caller checkout at all: this job runs the reviewer's own script and
      # reads the PR through the API, so the repository under review is never on
      # disk here.
      - &clone-reviewer
        name: Check out the reviewer from its own repository
        env:
          REVIEWER_REPO: ${{ inputs.reviewer-repository }}
          # Every caller must pass `reviewer-ref`. The fallback reads
          # `github.job_workflow_sha`, which is EMPTY in the expression context
          # on a local call and on a cross-repository call alike. It stays here
          # only so a caller that does set it keeps working.
          REVIEWER_REF: ${{ inputs.reviewer-ref || github.job_workflow_sha }}
        run: |
          # Empty means neither the caller nor GitHub named a commit, and a clone
          # would then run this repository's default branch — which is what
          # pinning `uses:` is for. Refuse rather than run unpinned code beside
          # the caller's secrets.
          : "${REVIEWER_REF:?pass reviewer-ref — the commit this reviewer must run. github.job_workflow_sha is empty in the expression context}"
          dest="${RUNNER_TEMP}/reviewer"
          git clone --no-tags "https://github.com/${REVIEWER_REPO}.git" "${dest}"
          # A ref may be a branch, a tag or a commit sha. `checkout --detach`
          # takes all three; `clone --branch` refuses a sha, which is the form a
          # caller pinning its `uses:` line has.
          git -C "${dest}" checkout --detach "${REVIEWER_REF}"
          # Outside GITHUB_WORKSPACE on purpose: the reviewed repository's
          # checkout must not be able to replace the code reviewing it.
          echo "REVIEWER_DIR=${dest}/.github/reviewer" >>"$GITHUB_ENV"
          # The coverage stamp records which reviewer read the pull request, so a
          # later run can tell a read by an older reviewer from its own.
          echo "REVIEWER_SHA=$(git -C "${dest}" rev-parse HEAD)" >>"$GITHUB_ENV"

      - name: Decide whether to review
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # `dispatch` is the accumulated read's own arm; every other value is
          # the pull_request_target action GitHub sent.
          ACTION: ${{ inputs.pr-number != '' && 'dispatch' || github.event.action }}
          REPO: ${{ github.repository }}
          # Empty on a dispatch, where the script reads the live head itself.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ inputs.pr-number || github.event.pull_request.number }}
          # The on-demand hatch. `labeled` reaches here only from a caller that
          # lists it, and only this label answers true.
          LABEL: ${{ github.event.label.name }}
          REVIEW_LABEL: ${{ inputs.review-label }}
          MAX_REVIEWS_PER_PR: ${{ inputs.max-reviews-per-pr }}
          MAX_DELTA_REVIEWS_PER_PR: ${{ inputs.max-delta-reviews-per-pr }}
          READS_MARKED_FROM: ${{ inputs.reads-marked-from }}
        run: bash "${REVIEWER_DIR}/decide-pr-review-trigger.sh"

  # Fetch the PR's diff and metadata, sanitize them, and route by size. No model
  # runs here. The re-check that guards the budget runs here too, because this
  # job holds the per-PR concurrency group.
  prepare:
    name: Fetch and sanitize the PR for review
    needs: decide
    if: needs.decide.outputs.run == 'true'
    # Concurrency lives on this JOB, not the workflow: a dropped event's skipped
    # job may or may not displace a queued run, and a gate that strands silently
    # could not tolerate either answer. cancel-in-progress is false so a started
    # run always reaches its read. Keyed by PR number, never static, so it
    # strands no check.
    concurrency:
      group: claude-pr-review-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The sanitizer's cost is per byte, and a 14.7 MB diff once spent 29 minutes
    # there; the elide command is what keeps a generated-file diff inside this.
    timeout-minutes: 30
    permissions:
      contents: read # check out the caller's trusted default branch
      pull-requests: read # fetch the diff and the metadata
      actions: read # the recheck lists in-flight runs of this workflow
    outputs:
      skip: ${{ steps.recheck.outputs.skip }}
      # The sanitized input exists, for a head that is still the live one.
      prepared: ${{ steps.prepare.conclusion == 'success' && steps.prepare.outputs.stale != 'true' }}
      unreviewable: ${{ steps.prepare.outputs.unreviewable }}
      # The read matrix: the sharder's list, or the one `whole` leg for a diff
      # that fits one context.
      shards: ${{ steps.prepare.outputs.sharded == 'true' && steps.prepare.outputs.shards || '["whole"]' }}
    steps:
      - &checkout-default
        name: Check out the calling repository's default (trusted) branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1

      - *clone-reviewer

      - name: Re-check that the PR still owes a review
        # Runs INSIDE the concurrency group, so the earlier run's prepare job has
        # finished: its review is submitted, still generating in its read or
        # post job (which the script spots through the runs API), or was never
        # produced. Only decide's never-reviewed trigger can race that way.
        id: recheck
        if: needs.decide.outputs.recheck == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          MAX_REVIEWS_PER_PR: ${{ inputs.max-reviews-per-pr }}
          MAX_DELTA_REVIEWS_PER_PR: ${{ inputs.max-delta-reviews-per-pr }}
          # Which budget this run is spending, so the re-check asks about the
          # same one decide approved.
          READ_KIND: ${{ needs.decide.outputs.read }}
          READS_MARKED_FROM: ${{ inputs.reads-marked-from }}
        run: bash "${REVIEWER_DIR}/recheck-pr-review-owed.sh"

      - name: Set up Node and the input sanitizer
        if: steps.recheck.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install the input sanitizer
        if: steps.recheck.outputs.skip != 'true'
        run: bash "${REVIEWER_DIR}/install-input-sanitizer.sh"

      - name: Restore the caller's setup cache
        # A setup command that fetches a pinned toolchain pays that download once
        # per job. The caller names what to keep and the key that expires it;
        # naming neither keeps the download. A prepare that skips needs no setup.
        if: steps.recheck.outputs.skip != 'true' && inputs.setup-command != '' && inputs.setup-cache-key-files != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.setup-cache-path }}
          key: ${{ runner.os }}-setup-${{ hashFiles(inputs.setup-cache-key-files) }}

      - name: Run the caller's setup command
        # The caller's own dependency sync, in its trusted base checkout — what
        # puts the elide command's tools in place.
        if: steps.recheck.outputs.skip != 'true' && inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -c "$SETUP_COMMAND"

      - name: Bail if a newer push already superseded this head
        # The owed-review re-check runs before the setup steps, so a push landing
        # inside that window still spends a paid read on a head nobody waits on.
        # This asks the same question at the last step boundary before the read.
        # The [opus-review] synchronize opt-in alone is exempt: it has no
        # guaranteed successor run, so bailing could strand the request.
        id: fresh
        if: >-
          steps.recheck.outputs.skip != 'true' &&
          (needs.decide.outputs.recheck == 'true' || github.event.action != 'synchronize')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          EVENT_HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
        run: bash "${REVIEWER_DIR}/recheck-pr-head-current.sh"

      - name: Fetch and sanitize the untrusted PR input
        # Writes the sanitized files the agent reads, and ROUTES the review: a
        # diff over max-diff-lines is split per file for the read matrix, and
        # only a diff too large to shard, or a PR aimed at a branch other than
        # the default, sets unreviewable=true and gets the human-review notice.
        id: prepare
        if: steps.recheck.outputs.skip != 'true' && steps.fresh.outputs.stale != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          ELIDE_COMMAND: ${{ inputs.elide-command }}
          MAX_DIFF_LINES: ${{ inputs.max-diff-lines }}
          SHARD_MAX_LINES: ${{ inputs.shard-max-lines }}
          MAX_SHARDABLE_LINES: ${{ inputs.max-shardable-lines }}
          # What the coverage stamp will claim, and where an accumulated read
          # starts. HEAD_SHA is the head decide resolved: prepare refuses to read a
          # pull request whose head moved since, rather than stamping a head that
          # no longer exists as covered.
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          READ: ${{ needs.decide.outputs.read }}
          SINCE: ${{ needs.decide.outputs.since }}
        run: bash "${REVIEWER_DIR}/prepare-pr-review-input.sh"

      - name: Hand the sanitized input to the read and post jobs
        # runner.temp does not survive the job. The post job anchors every
        # finding against this diff.txt, so both later jobs read the same bytes.
        if: steps.prepare.conclusion == 'success' && steps.prepare.outputs.stale != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-input
          path: ${{ runner.temp }}/pr-input
          retention-days: 1
          overwrite: true

  # The ONLY job that runs a model, and it can write to nothing: contents:read
  # and a token it never hands the agent a tool to use. Each attempt is one
  # claude-code-action step running the vendored code-review prompt; the steps
  # below repeat one attempt and one judge through YAML aliases, and
  # review-ladder.py carries the ladder state between them. One leg per shard,
  # or the one `whole` leg; every leg runs the same prompt and ladder.
  read:
    name: Claude PR review (read)
    needs: [decide, prepare]
    if: needs.prepare.outputs.prepared == 'true' && needs.prepare.outputs.unreviewable == 'false'
    runs-on: ubuntu-latest
    strategy:
      # No fail-fast: one leg's credential exhaustion must not cancel the others.
      # post folds what the legs delivered and says so when one is missing.
      fail-fast: false
      # Every leg draws on the SAME credential pool at the same moment, so one
      # rate-limited leg costs the PR a complete read, and an unbounded matrix
      # makes that likelier the larger the PR.
      max-parallel: 6
      matrix:
        leg: ${{ fromJSON(needs.prepare.outputs.shards) }}
    # Clears one whole read's measured tail plus the action's own install, the
    # redacting log upload, and a retry on a fresh credential.
    timeout-minutes: 40
    permissions:
      contents: read # check out the caller's trusted default branch; nothing may be posted
    env:
      # Each rung's KIND, never its value: review-ladder.py orders the attempts
      # from these, so a metered key runs after every subscription token.
      RUNG_1_KIND: ${{ startsWith(secrets.rung_1, 'sk-ant-oat') && 'oauth' || secrets.rung_1 != '' && 'metered' || '' }}
      RUNG_2_KIND: ${{ startsWith(secrets.rung_2, 'sk-ant-oat') && 'oauth' || secrets.rung_2 != '' && 'metered' || '' }}
      RUNG_3_KIND: ${{ startsWith(secrets.rung_3, 'sk-ant-oat') && 'oauth' || secrets.rung_3 != '' && 'metered' || '' }}
      RUNG_4_KIND: ${{ startsWith(secrets.rung_4, 'sk-ant-oat') && 'oauth' || secrets.rung_4 != '' && 'metered' || '' }}
      RUNG_5_KIND: ${{ startsWith(secrets.rung_5, 'sk-ant-oat') && 'oauth' || secrets.rung_5 != '' && 'metered' || '' }}
      RUNG_6_KIND: ${{ startsWith(secrets.rung_6, 'sk-ant-oat') && 'oauth' || secrets.rung_6 != '' && 'metered' || '' }}
      RUNG_7_KIND: ${{ startsWith(secrets.rung_7, 'sk-ant-oat') && 'oauth' || secrets.rung_7 != '' && 'metered' || '' }}
      RUNG_8_KIND: ${{ startsWith(secrets.rung_8, 'sk-ant-oat') && 'oauth' || secrets.rung_8 != '' && 'metered' || '' }}
    steps:
      - *checkout-default

      - *clone-reviewer

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - &restore-setup-cache
        name: Restore the caller's setup cache
        # A setup command that fetches a pinned toolchain pays that download once
        # per job. The caller names what to keep and the key that expires it;
        # naming neither keeps the download.
        if: inputs.setup-command != '' && inputs.setup-cache-key-files != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.setup-cache-path }}
          key: ${{ runner.os }}-setup-${{ hashFiles(inputs.setup-cache-key-files) }}

      - &run-setup
        name: Run the caller's setup command
        # The caller's own dependency sync, in its trusted base checkout — what
        # puts the log redactor's or the gate command's tools in place.
        if: inputs.setup-command != ''
        env:
          SETUP_COMMAND: ${{ inputs.setup-command }}
        run: bash -c "$SETUP_COMMAND"

      - name: Fetch the sanitized input
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-input
          path: ${{ runner.temp }}/pr-input

      - name: Narrow this leg's diff.txt to its shard
        # The prompt reads diff.txt by that name, so a shard leg gets its slice
        # under that name rather than teaching the prompt about sharding.
        if: matrix.leg != 'whole'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          LEG: ${{ matrix.leg }}
        run: cp "${PR_INPUT_DIR}/shards/${LEG}" "${PR_INPUT_DIR}/diff.txt"

      - name: Plan the credential ladder and the read
        id: plan
        env:
          READ_LEG: ${{ matrix.leg }}
          MODEL: ${{ inputs.model }}
          MODEL_LOW: ${{ inputs.model-low }}
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          PROMPT_FILE: ${{ inputs.review-prompt || format('{0}/prompts/code-review.md', env.REVIEWER_DIR) }}
          EXTRA_INSTRUCTIONS_FILE: ${{ inputs.extra-instructions }}
          PR_NUMBER: ${{ needs.decide.outputs.pr }}
          REPO: ${{ github.repository }}
          REVIEW_TIMEOUT_SECONDS: ${{ inputs.review-timeout-seconds }}
        run: /usr/bin/python3 "${REVIEWER_DIR}/review-ladder.py" plan

      # One credential attempt. Every copy below is this same step: the judge
      # step after it sets LADDER_GO, LADDER_RUNG and LADDER_KIND for the next
      # copy. The token is chosen by rung number here, in the expression, so no
      # script ever holds a secret and each attempt holds only its own.
      - &attempt
        name: Read the PR with the code-review plugin
        if: env.LADDER_GO == 'true'
        # The judge reads the attempt's log; a red attempt must not end the job
        # before a later rung can run.
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(env.LADDER_TIMEOUT_MINUTES) }}
        uses: anthropics/claude-code-action@8041f1d17e0e7d2f2cfe35002962e9f26237c0bb # v1.0.263
        with:
          claude_code_oauth_token: >-
            ${{ env.LADDER_KIND == 'oauth' && (
            env.LADDER_RUNG == '1' && secrets.rung_1 ||
            env.LADDER_RUNG == '2' && secrets.rung_2 ||
            env.LADDER_RUNG == '3' && secrets.rung_3 ||
            env.LADDER_RUNG == '4' && secrets.rung_4 ||
            env.LADDER_RUNG == '5' && secrets.rung_5 ||
            env.LADDER_RUNG == '6' && secrets.rung_6 ||
            env.LADDER_RUNG == '7' && secrets.rung_7 ||
            env.LADDER_RUNG == '8' && secrets.rung_8
            ) || '' }}
          anthropic_api_key: >-
            ${{ env.LADDER_KIND == 'metered' && (
            env.LADDER_RUNG == '1' && secrets.rung_1 ||
            env.LADDER_RUNG == '2' && secrets.rung_2 ||
            env.LADDER_RUNG == '3' && secrets.rung_3 ||
            env.LADDER_RUNG == '4' && secrets.rung_4 ||
            env.LADDER_RUNG == '5' && secrets.rung_5 ||
            env.LADDER_RUNG == '6' && secrets.rung_6 ||
            env.LADDER_RUNG == '7' && secrets.rung_7 ||
            env.LADDER_RUNG == '8' && secrets.rung_8
            ) || '' }}
          # The job's own contents:read token. Passing it stops the action from
          # minting its GitHub App token, which would carry write scopes.
          github_token: ${{ github.token }}
          prompt: ${{ steps.plan.outputs.prompt }}
          # INVARIANT — the action restores CLAUDE.md and .claude/ from this branch
          # over the checkout before the model starts. Under pull_request_target it
          # reads this input, not the PR's base, so a PR stacked on another branch
          # still runs on the default branch's instructions.
          base_branch: ${{ github.event.repository.default_branch }}
          # The model is named here, ahead of the plan's flags, so the step that
          # spends the credential states which model it pays for.
          claude_args: >-
            --model ${{ inputs.model }}
            ${{ steps.plan.outputs.claude_args }}
          # A fork author and a bot both get a read. That is safe only because
          # this job holds contents:read and the agent has no shell or network.
          allowed_non_write_users: "*"
          allowed_bots: "*"
          # The action posts nothing from this job: findings leave as structured
          # output, and a token with no write scope could not post them anyway.
          classify_inline_comments: "false"
      - &judge
        name: Judge the attempt and arm the next rung
        if: env.LADDER_GO == 'true'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: /usr/bin/python3 "${REVIEWER_DIR}/review-ladder.py" next
      - *attempt
      - *judge
      - *attempt
      - *judge
      - *attempt
      - *judge
      - *attempt
      - *judge
      - *attempt
      - *judge
      - *attempt
      - *judge
      - *attempt
      - *judge

      - name: Fail loud if every credential attempt errored
        # The ladder advances on a proven error; if the LAST attempt still
        # errored this classifies it — a zero-cost credential failure against a
        # real run failure — instead of surfacing as the generic "no findings".
        env:
          EXECUTION_FILE: ${{ env.REVIEW_EXECUTION_FILE }}
          CONTEXT: Claude PR review attempt
        run: /usr/bin/python3 "${REVIEWER_DIR}/checks/claude-execution.py"

      - name: Map the findings to severities and record the cost
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          EXECUTION_FILE: ${{ env.REVIEW_EXECUTION_FILE }}
        run: node "${REVIEWER_DIR}/record-review.mjs"

      - name: Stage the review under a directory named for the leg
        # review-handoff-smoke.yaml runs this step, the upload below and post's
        # download for real on every PR that touches them; keep the three in step.
        env:
          LEG: ${{ matrix.leg }}
        run: bash "${REVIEWER_DIR}/stage-leg-review.sh" "${LEG}" "${RUNNER_TEMP}/pr-input" "${RUNNER_TEMP}/leg-out"

      - name: Hand the review to the post job
        # review.json and the cost number only. The execution log stays on this
        # runner and leaves it solely through the redacting upload below.
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pr-review-findings-${{ matrix.leg }}
          path: ${{ runner.temp }}/leg-out
          retention-days: 1
          overwrite: true

      - name: Stage the run's Claude logs, redacted
        # always(): the log is most needed when the job just failed, and equally
        # when it stayed GREEN on a wrong result, which has no failing step to
        # hang an upload off. An absent log-redactor publishes NOTHING.
        id: stage_logs
        if: always() && inputs.log-redactor != ''
        timeout-minutes: 5
        env:
          LOGS_PATH: ${{ env.REVIEW_EXECUTION_FILE }}
          LOGS_OUT: ${{ runner.temp }}/agent-logs-upload/pr-review
          REDACTOR: ${{ github.workspace }}/${{ inputs.log-redactor }}
          REPO_ROOT: ${{ github.workspace }}
          HOOKS_DIR: ${{ github.workspace }}/.claude/hooks
          PYTHON: ${{ inputs.log-redactor-python }}
        run: |
          mkdir -p "${LOGS_OUT}"
          bash "${REVIEWER_DIR}/stage-agent-logs.sh"

      - name: Publish the run's Claude logs
        if: always() && steps.stage_logs.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Keyed by the leg, or the legs collide and only one log survives.
          name: claude-logs-pr-review-${{ matrix.leg }}
          path: ${{ runner.temp }}/agent-logs-upload/pr-review
          if-no-files-found: ignore
          retention-days: 14

  # Folds every read leg's review.json into ONE PR review, or posts the
  # oversized notice, and re-evaluates the caller's merge gate. It runs no model.
  post:
    name: Post the PR review
    needs: [decide, prepare, read]
    # always(): a failed or skipped read still owes the gate a verdict on this
    # head. A failed prepare, or a head that moved before prepare read it, owes
    # nothing — that verdict would name a head the PR no longer has. A prepare
    # that skipped re-posts the gate from `gate` instead, outside this job's
    # concurrency group, so it can never cancel a pending post that carries a read.
    if: >-
      always() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.prepared == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # A started post runs to completion, so the review it writes is never thrown
    # away mid-write.
    concurrency:
      group: claude-pr-review-post-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # post the review
      statuses: write # post-review-command re-posts a merge gate's verdict
      checks: read # a caller's gate may read another reviewer's check run
    steps:
      - *checkout-default

      - *clone-reviewer

      # Before any posting step, so the post-review command finds the caller's
      # tools in place even when a posting step failed.
      - *restore-setup-cache

      - *run-setup

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.prepare.outputs.prepared == 'true'
        with:
          node-version: "22"

      - name: Install the input sanitizer
        # post-pr-review.mjs sanitizes the findings it renders, so this job needs
        # the package even though it runs no model.
        if: needs.prepare.outputs.prepared == 'true'
        run: bash "${REVIEWER_DIR}/install-input-sanitizer.sh"

      - name: Fetch the sanitized input (the diff the findings anchor to)
        id: input
        if: needs.prepare.outputs.prepared == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pr-review-input
          path: ${{ runner.temp }}/pr-input

      - name: Fetch every read leg's review
        # Not gated on the read job's result: a matrix reports failure when ANY
        # leg failed, and the legs that delivered still owe the PR their findings.
        # merge-multiple: v8 extracts a lone pattern match flat into `path` but
        # several into `path/<artifact>/`; merging always gives `path/<leg>/`.
        if: needs.prepare.outputs.unreviewable == 'false'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pr-review-findings-*
          path: ${{ runner.temp }}/read-legs
          merge-multiple: true

      - name: Fold the legs into one review
        # Refuses when no leg delivered. A missing leg makes the review say the
        # read is incomplete, and leaves the marker that keeps it from counting
        # as a read; merge-shard-reviews.mjs owns that rule.
        id: fold
        if: always() && steps.input.outcome == 'success' && needs.prepare.outputs.unreviewable == 'false'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          SHARD_REVIEW_DIR: ${{ runner.temp }}/read-legs
        run: node "${REVIEWER_DIR}/merge-shard-reviews.mjs"

      - name: Post the oversized notice as a review plus a human-review thread
        # A diff too large to read gets no automated read, so the notice posts as
        # a COMMENT review plus one thread a HUMAN resolves after reviewing — the
        # PR merges on that sign-off instead of staying blocked.
        if: needs.prepare.outputs.unreviewable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          # The notice stamps coverage, so it needs the budget that paid for it.
          READ: ${{ needs.decide.outputs.read }}
        run: bash "${REVIEWER_DIR}/post-oversized-review.sh"

      - name: Post the structured review
        # Turns review.json into ONE PR review with inline comments and suggested
        # edits, validating every anchor against the diff first.
        if: always() && steps.fold.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
          HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          # The whole read's price the fold summed, for the footer.
          EXECUTION_FILE: ${{ runner.temp }}/pr-input/cost.json
        run: bash "${REVIEWER_DIR}/post-pr-review.sh"

      - name: Fail loud if a read leg delivered no review
        # The review already says so and carries no read marker; this reds the
        # run, so the lost leg is visible beside the review that names it.
        if: always() && steps.fold.outputs.complete == 'false'
        run: |
          echo "::error::a read leg delivered no review, so the posted review is incomplete and does not count as a read"
          exit 1

      - &gate-repost
        name: Re-evaluate the caller's merge gate on the LIVE head
        # The review posted with the workflow GITHUB_TOKEN, whose events fire no
        # workflows, so a gate that reads the review never hears about it. This
        # is the only step that posts a verdict, and always() keeps it running
        # when an earlier step reddened the job.
        #
        # The head is read LIVE, not taken from the event. A read takes long
        # enough for a push to land inside it, and that push's own run yields to
        # this one (it sees the read in flight) — so the event's sha is a head
        # nobody is waiting on, and a verdict posted there leaves the live head
        # with no event able to clear it. The event's sha is the fallback for a
        # read that fails, which is the behaviour a missing read would give.
        if: always() && inputs.post-review-command != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.decide.outputs.pr }}
          EVENT_HEAD_SHA: ${{ needs.decide.outputs.head_sha }}
          POST_REVIEW_COMMAND: ${{ inputs.post-review-command }}
        run: |
          if live="$(gh pr view "$PR" --repo "$GH_REPO" --json headRefOid --jq .headRefOid)"; then :; else live=""; fi
          REPORT_SHA="${live:-$EVENT_HEAD_SHA}"
          export REPORT_SHA
          echo "posting the gate verdict on ${REPORT_SHA}"
          bash -c "$POST_REVIEW_COMMAND"

  # The skip path's gate re-post: prepare found the PR owes no read, so no review
  # posts, but the caller's gate still owes this head a verdict. Its own
  # concurrency group, never post's: a pending job in a group is cancelled by
  # the next one queued, and a gate-only run must not cancel a post that carries
  # a paid read's findings.
  gate:
    name: Re-evaluate the merge gate
    needs: [decide, prepare]
    if: needs.prepare.result == 'success' && needs.prepare.outputs.skip == 'true' && inputs.post-review-command != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: claude-pr-review-gate-${{ needs.decide.outputs.pr }}
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write # the caller's gate command may write to the PR
      statuses: write # post-review-command re-posts a merge gate's verdict
      checks: read # a caller's gate may read another reviewer's check run
    steps:
      - *checkout-default

      - *clone-reviewer

      - *restore-setup-cache

      - *run-setup

      - *gate-repost
