name: Claude reviewer-hold sweeper

# Periodically re-derive both pieces of automated-reviewer state on every open PR:
# the APPROVE that supersedes a stale CHANGES_REQUESTED once all of the reviewer's
# threads are resolved, and the `Automated review posted` merge gate, which stays
# RED while one of those threads is unresolved. This is the safety net for the
# resolve-WITHOUT-a-push case:
# GitHub has no workflow trigger that fires when a review thread is resolved
# (`pull_request_review_thread` is a webhook event but NOT a valid workflow `on:`
# event — GitHub rejects it at compile time), so a thread resolved manually with no
# follow-up push emits nothing for the push-time approve step in
# claude-review.yaml to react to, and no event for review-gate.yaml to re-post its
# verdict on. A cron sweep re-runs both state-based evaluations for all open PRs, so
# no resolution path can strand the hold or leave a handled PR red. Each is
# idempotent — approve-if-reviewer-hold-clear.sh and review-findings-gate.sh both read the
# current thread and review state — so a sweep never double-approves, and never
# publishes a verdict the live state does not support.
#
# SECURITY — schedule + workflow_dispatch run from the DEFAULT branch (trusted repo
# content) with the base repo's GITHUB_TOKEN; the job checks out ONLY the trusted
# approval and gate scripts and executes no PR code — it reads thread/review state via
# the API and can only post an approval or a commit status. Least privilege:
# contents:read (checkout the scripts) + pull-requests:write (post the approval) +
# statuses:write (post the gate verdict), nothing else, so even an unexpected PR can
# only be approved or have its verdict refreshed, never pushed to or merged.

on:
  schedule:
    # Twice hourly, offset off the top of the hour to dodge the scheduler rush.
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  sweep:
    name: Clear stranded automated-reviewer holds across open PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # sparse-checkout the trusted approval scripts
      pull-requests: write # submit the approving review
      statuses: write # re-post the `Automated review posted` verdict per PR
    env:
      # The sweep's own PR listing runs on the Actions token.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # The only rung the sweep gets. approve-if-reviewer-hold-clear.sh picks its
      # credential from this ladder, and the sweep deliberately carries no PAT:
      # GitHub bars the Actions token from approving, so the sweep clears a hold
      # by dismissing it rather than by minting an approval on a PR no push-time
      # review just examined.
      GH_TOKEN_ACTIONS: ${{ secrets.GITHUB_TOKEN }}
      # The gate links its status back to the run that posted it, so a
      # sweep's re-post keeps the Details link review-gate.yaml's post carries.
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout the trusted approval and gate scripts (default branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sweep runs review-findings-gate.sh too, which sources the
          # reviewer's thread, review and skip-set libraries and reads the
          # severity SSOT; none of them lives under .github/scripts, so each is
          # named here.
          sparse-checkout: |
            .github/scripts
            .github/reviewer/review-findings-gate.sh
            .github/reviewer/lib/review-threads.bash
            .github/reviewer/lib/pr-reviews.bash
            .github/reviewer/lib/review-skip-set.bash
            .github/reviewer/lib-ci-retry.sh
            config/review-severities.json
          sparse-checkout-cone-mode: false
      - name: Sweep open PRs, clear any cleared reviewer hold, re-post the gate
        run: bash .github/scripts/sweep-reviewer-holds.sh
