name: Claude reviewers

# Umbrella for the two automated PR reviewers: the first-pass reviewer
# (claude-pr-review.yaml) and the Sonnet merge-delta reviewer
# (claude-merge-delta-review.yaml). Each was its own file; they are
# consolidated here to cut the per-PR workflow fan-out on a shared, capped runner
# pool. Every job stays self-contained and carries its own SECURITY header,
# `permissions:`, base-only checkout posture, and `if:` guards verbatim — nothing
# about the trust boundary changed in the move. Both run on the reviewers'
# shared pull_request_target trigger (the union of the three source triggers) with
# a base-only checkout and a least-privilege token, and each is guarded by
# `github.event.action` so it fires on exactly the events its source workflow
# fired on. Concurrency is declared PER JOB (never workflow-level), keeping each
# source workflow's own group name so the jobs never cancel one another.
#
# The merge-conflict auto-resolver stays a SEPARATE file
# (auto-resolve-conflicts.yaml): it checks out the PR HEAD to merge into it, and
# co-locating a head checkout with pull_request_target trips CodeQL's
# untrusted-checkout query (file-scoped, blind to per-job event gating) and would
# blind that query to these secrets-bearing reviewer jobs. The scheduled
# reviewer-hold sweeper (claude-reviewer-hold-clear.yaml) is likewise separate.

on: # zizmor: ignore[dangerous-triggers] — reviewer jobs are base-only checkout + least privilege; see each job's header
  # Union of the three source triggers. `opened`/`ready_for_review`/`synchronize`
  # drive the first-pass reviewer; `synchronize` also drives the thread resolver;
  # `labeled` is the first-pass reviewer's on-demand escape hatch (the
  # `needs-auto-review` label). Each job's `if:` re-scopes it to its own events.
  # Because pull_request_target always runs the workflow file from the base
  # branch, these reviewers only take effect once merged to the default branch.
  pull_request_target: # not-required-check
    types: [opened, ready_for_review, synchronize, labeled]

permissions: {}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # The skip decision, computed ONCE.
  #
  # `review` and `auto_approve_skipped` must be exact complements: every pull
  # request is reviewed or approved, never neither and never both. Stating the
  # predicate in each job's `if:` made that a claim in a comment — the two copies
  # drifted on `draft` and a draft in the skip class matched neither. One output,
  # read by both, makes the complement structural.
  #
  # A title is author-written, so the class needs the trust half: only a same-repo
  # head, which already implies write access.
  # ────────────────────────────────────────────────────────────────────────────
  classify:
    name: Decide whether the reviewer skips this PR
    # not-required-check: computes a routing decision, reports no verdict.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.decide.outputs.skip }}
    steps:
      - id: decide
        env:
          SKIP: >-
            ${{
              github.event.pull_request.draft == false &&
              github.event.pull_request.head.repo.full_name == github.repository &&
              (
                github.event.pull_request.user.type == 'Bot' ||
                startsWith(github.event.pull_request.title, 'chore:') ||
                startsWith(github.event.pull_request.title, 'chore(') ||
                startsWith(github.event.pull_request.title, 'style:') ||
                startsWith(github.event.pull_request.title, 'style(') ||
                startsWith(github.event.pull_request.title, 'release:') ||
                startsWith(github.event.pull_request.title, 'release(')
              )
            }}
        run: echo "skip=${SKIP}" >>"$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # Claude PR review (first pass) — one whole-diff read per PR, sharded across
  # parallel passes and posted as one review.
  #
  # The reviewer itself lives in `review.yaml` in this repository, as a reusable
  # workflow other repositories call by `uses:`. This job is the caller, and it is
  # also how this repository dogfoods its own reviewer: a change to the reviewer
  # reviews the pull request that makes it.
  #
  # SECURITY — the reviewer's own header states the posture in full: a base-only
  # checkout, the PR's changes read only as sanitized DATA, and least privilege
  # per job. The `permissions:` block below is the CEILING those jobs are narrowed
  # from, never a grant — GitHub lets a called workflow request only what the
  # calling job holds, so a caller that grants less ends the run in
  # `startup_failure` before any job starts.
  # ────────────────────────────────────────────────────────────────────────────
  review:
    # Reads `classify`, so this is the exact complement of `auto_approve_skipped`
    # by construction. `labeled` is the on-demand hatch: it starts the read the
    # stand-in approval offers, whatever the class says.
    needs: classify
    if: >-
      github.event.action == 'labeled' ||
      (
        contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
        needs.classify.outputs.skip != 'true'
      )
    permissions:
      contents: read
      pull-requests: write
      statuses: write
      actions: read
      checks: read
    uses: ./.github/workflows/review.yaml
    with:
      reviewer-repository: AlexanderMattTurner/agent-review
      # This call is local, so the commit to run is this workflow file's own.
      # `pull_request_target` runs the file from the base branch, and
      # `github.sha` names that commit. Do not drop this: the called workflow's
      # `github.job_workflow_sha` fallback is empty and it would refuse to clone.
      reviewer-ref: ${{ github.sha }}
      review-prompt: .github/prompts/claude-pr-review.md
      # Re-post the `Automated review posted` verdict once the review (and its
      # finding threads) exist. Nothing else would: the review posts with the
      # workflow GITHUB_TOKEN, whose events start no workflow run, so
      # review-gate.yaml never hears about it and the gate would keep the head's
      # pre-review red until the next push. HEAD_SHA is the gate's own name for
      # the sha this contract calls REPORT_SHA.
      #
      # The PARITY leg needs the same re-post for the same reason, and this is
      # the transition that comparison most wants: the exported predicate's
      # first named divergence is about whether a review exists at all. Its own
      # workflow cannot hear this event either. It is a SHADOW, so its exit
      # status is reported and never propagated — branching on the code rather
      # than `|| true`, which would swallow a real failure of the live gate on
      # the first line too.
      post-review-command: |
        HEAD_SHA="$REPORT_SHA" bash .github/scripts/review-gate.sh
        GATE_CONTEXT="Review findings resolved (parity)" \
          SEVERITY_CONFIG="${PWD}/config/review-severities.json" \
          UNREVIEWED_STATE=failure \
          bash .github/reviewer/review-findings-gate.sh
        rc=$?
        [ "$rc" -eq 0 ] || echo "::warning::parity gate exited ${rc}; its shadow context is stale for this head"
    secrets:
      rung_1: ${{ secrets.FAR_ANTHROPIC_API_KEY }}
      rung_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
      rung_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
      rung_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
      rung_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
      rung_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
      rung_7: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
      rung_8: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  # Auto-approve the pull requests the review job above skips — a bot author, or
  # a chore/style/release title, on a trusted pull request.
  #
  # The required check of this repository is the `Automated review posted`
  # status. review-gate.sh posts it, and it is RED until the reviewer has left a
  # review with a body. A skipped pull request gets no such review, so it strands
  # on a check that nothing will ever turn green. The deliberate skip is what
  # licenses the merge, so this job posts the missing review and then re-runs the
  # gate. It offers the `needs-auto-review` label to anyone who wants a real read
  # after all.
  #
  # The approval carries the reviewer identity because it posts with
  # GITHUB_TOKEN, which is what makes the gate count it. So the gate is re-derived
  # here, never asserted: review-gate.sh reads the reviews and the finding threads
  # and posts whatever it finds.
  #
  # A draft is excluded. It cannot merge, and it reaches this job on
  # `ready_for_review`.
  #
  # This job posts one review and one commit status. It runs no pull-request code.
  # ────────────────────────────────────────────────────────────────────────────
  auto_approve_skipped:
    name: Auto-approve low-risk and bot PRs the reviewer skips
    # Reads the same `classify` output the review job negates, so the two are
    # complements by construction rather than by a comment.
    needs: classify
    if: >-
      contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
      needs.classify.outputs.skip == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Keyed per head, and never cancelling a run in flight, for the same reason
    # review-gate.yaml is: a cancel between the approval and the status loses the
    # verdict and leaves the head with a stale one.
    concurrency:
      group: auto-approve-skipped-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    permissions:
      contents: read # sparse-checkout the trusted scripts
      pull-requests: write # submit the approving review, and read the finding threads
      statuses: write # post the gate verdict on the head
    steps:
      - name: Checkout the trusted scripts (default branch)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # The default branch GitHub reports — never base.ref, which the pull
          # request author picks, and never the untrusted head. Same posture as
          # the review job above.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          # Each script AND every file it sources. A sparse checkout naming
          # single files gets exactly those, so a missing one kills the step at
          # its `source` line under `set -e`.
          sparse-checkout: |
            .github/scripts/auto-approve-skipped-pr.sh
            .github/scripts/lib-post-review-with-retry.sh
            .github/scripts/review-gate.sh
            .github/scripts/lib/reviewer-login.bash
            .github/reviewer/lib/review-threads.bash
            .github/reviewer/lib-ci-retry.sh
            config/review-severities.json
          sparse-checkout-cone-mode: false

      - name: Approve so a review-required ruleset does not strand a skipped PR
        # Runs on EVERY event this job takes, `synchronize` included. A ruleset
        # with "dismiss stale reviews" drops this approval on a push, and no
        # other path re-posts one: the hold sweeper re-posts the status alone.
        # Re-posting here is what keeps the class off a permanently red gate,
        # and this file syncs into repos whose rulesets this one cannot read.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: bash .github/scripts/auto-approve-skipped-pr.sh

      # `always()`, because the two levers are independent: the approval answers
      # the review-required ruleset, this status answers the required check. A
      # bare step skips when the approve step fails — and it fails whenever the
      # repository forbids Actions to approve — which strands the whole class on
      # a red check. That failure stays loud: this job still goes red.
      - name: Post the gate verdict on this head
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/review-gate.sh

  # This workflow deliberately does NOT arm auto-merge. Arming belongs to the
  # flow that OPENS a pull request: only that flow holds the facts the decision
  # needs. template-sync-automerge.sh refuses to arm a sync whose conflict a
  # model resolved, and dependabot-auto-merge.yaml arms every dependabot PR,
  # but refuses when the base branch requires no status checks.
  # A reviewer-side job that armed every skipped pull request overrode both.

  # ────────────────────────────────────────────────────────────────────────────
  # Claude merge-delta review (Sonnet) — from claude-merge-delta-review.yaml
  #
  # A dedicated Sonnet reviewer for a PR's hand-authored MERGE-RESOLUTION deltas
  # (`git show --remerge-diff`) — the one channel through which a conflict
  # resolution can introduce content present in neither parent (an "evil merge")
  # that the ordinary PR diff never isolates. Separate from the first-pass
  # reviewer (the review job) and the thread-resolver: those read the net
  # diff and so share the blind spot this closes.
  #
  # SECURITY — same posture as the review job (see its header): a fork PR on
  # plain `pull_request` gets no secrets, so `pull_request_target` runs in the
  # trusted BASE context. To stay safe this workflow:
  #   1. checks out the BASE branch, never the untrusted PR head — no fork-authored
  #      code is checked out or executed;
  #   2. brings the PR head's commits in only as git OBJECTS (prepare-merge-delta-
  #      input.sh fetches refs/pull/N/head with per-command auth and never checks it
  #      out), renders the remerge-diff with the trusted base-checkout renderer, and
  #      sanitizes it before the model sees it — treated as untrusted DATA;
  #   3. holds least privilege — contents:read + pull-requests:write only, so even a
  #      successful injection can post a PR comment but cannot push, merge, or reach
  #      any other scope; the reviewer only ANALYZES and the post step is advisory.
  # Because pull_request_target always runs the workflow from the base branch, this
  # reviewer only takes effect once merged to the default branch.
  # ────────────────────────────────────────────────────────────────────────────
  merge_delta_review:
    name: Review the PR's merge-resolution deltas
    # Skip drafts (can't merge) and bot-authored PRs (never Claude-reviewed). The
    # action guard keeps it off the union's `labeled` escape hatch — the source
    # workflow fired only on opened/ready_for_review/synchronize.
    if: >-
      contains(fromJSON('["opened","ready_for_review","synchronize"]'), github.event.action) &&
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One review per PR at a time; a newer push supersedes an in-flight run (latest
    # head wins). Keyed by PR number, so it never strands a required check.
    concurrency:
      group: claude-merge-delta-review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      contents: read # checkout the trusted base commit
      pull-requests: write # post the advisory comment
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout base (trusted) branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # Default branch (trusted repo content), never the untrusted PR head
          # and never the author-writable base.ref — same rationale as the
          # review job. fetch-depth: 0 so the merge-base of the PR head
          # (fetched as objects) resolves.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0

      - name: Install the input sanitizer
        # Self-contained install (into .github/scripts/node_modules) so repos
        # synced from the template need no sanitizer entry in their own
        # package.json. --ignore-scripts keeps the install hermetic.
        run: bash .github/scripts/install-input-sanitizer.sh

      - name: Render and sanitize the merge-resolution deltas
        id: prepare
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/prepare-merge-delta-input.sh

      - name: Review the merge deltas with Claude (Sonnet)
        if: steps.prepare.outputs.has_deltas == 'true'
        uses: ./.github/actions/claude-run
        with:
          # CLAUDE_CODE_OAUTH_TOKEN fills the LAST tier: it is the account an
          # operator already has, so CI spends every token provisioned for CI
          # first. A tier left unset is skipped, so a setup that configures only
          # that one secret reaches it with no wasted attempt.
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK }}
          fallback_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_2 }}
          fallback_oauth_token_2: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_3 }}
          fallback_oauth_token_3: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_4 }}
          fallback_oauth_token_4: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_5 }}
          fallback_oauth_token_5: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN_FALLBACK_6 }}
          fallback_oauth_token_6: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Give the action the workflow token directly. Without it, the action
          # tries to mint one via an OIDC→GitHub-App token exchange that isn't
          # authorized here and fails with "401 Invalid OIDC token" before Claude
          # runs.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Review outside-contributor PRs too; safe for the same reasons as the
          # first-pass reviewer (base-only checkout, least-privilege token,
          # sanitized data-only input).
          allowed_non_write_users: "*"
          model: claude-sonnet-5
          claude_args: >-
            --setting-sources user
            --allowedTools "Read,Grep,Glob,Write"
            --add-dir "${{ runner.temp }}/pr-input"
          prompt: |
            You are the merge-delta reviewer for PR #${{ github.event.pull_request.number }} in ${{ github.repository }}.
            Follow the instructions in .github/prompts/claude-merge-delta-review.md — it is the
            single source of truth for how to review and the exact merge-review.md format.

            Write your review to ${{ runner.temp }}/pr-input/merge-review.md — nothing else.
            Do not post comments, resolve threads, push commits, edit the PR, or merge.
          # claude-run prepends the canonical untrusted-data guard for these.
          untrusted_files: |
            merge deltas: ${{ runner.temp }}/pr-input/merge-delta.txt

      - name: Post the advisory merge-delta review
        # Runs whenever prepare SUCCEEDED — including has_deltas=false — so a
        # sticky comment about a since-removed merge is refreshed to the clean
        # verdict rather than left stale. Skipped when prepare failed loud (an
        # octopus / renderer error), where the red job IS the signal.
        if: steps.prepare.conclusion == 'success'
        env:
          PR_INPUT_DIR: ${{ runner.temp }}/pr-input
        run: bash .github/scripts/post-merge-delta-review.sh
