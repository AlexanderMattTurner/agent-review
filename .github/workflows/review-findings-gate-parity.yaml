name: Review-findings gate (parity)

# THE PARITY LEG, AND IT IS TEMPORARY. Delete this file in the change that
# swaps review-gate.yaml onto the exported gate.
#
# review-findings-gate.yaml exports the gate this repository already runs, as a
# reusable workflow. Swapping the live one onto it is a rewrite of machinery
# that acts with no human watching, so it lands behind a parity period rather
# than big-bang: this job runs the EXPORTED predicate beside the live one on
# every pull request and posts its verdict under a DIFFERENT, non-required
# context, so the two answers sit side by side on each head and a divergence is
# visible before anything depends on it.
#
# It also makes the export's first consumer this repository, which is where a
# broken gate is cheapest to notice: nothing else exercises the clone step, the
# sparse checkout of the severity SSOT, or `status-context` until a downstream
# repository pins it.
#
# The two known divergences to watch for, both intended:
#   * a DISMISSED review counts as a read here and not in review-gate.sh, so a
#     pull request whose only review was dismissed reads green here and red
#     there;
#   * this posts `failure` before the first review, matching review-gate.sh's
#     own reasoning that a `pending` status is invisible in `gh pr checks`.
#
# The skip set is left EMPTY, because this repository's reviewer reads every
# pull request — see review.yaml's decide job. Nothing is waived.
on: # zizmor: ignore[dangerous-triggers] — no PR code executes: API-only scripts off a pinned clone and a default-branch checkout
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_review_comment:
    types: [created]

permissions: {}

jobs:
  parity:
    name: Review-findings gate parity # required-check: false  # a shadow verdict under its own context; it gates nothing
    # A parity leg must never fail a pull request, and it fails by construction
    # on the change that INTRODUCES the exported script: the clone below reads
    # `github.sha`, which under pull_request_target is the base branch, where
    # the script does not exist yet. Reading it off the pull request head
    # instead would execute PR-authored code under this trigger, which is the
    # one thing it must not do.
    continue-on-error: true
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: ./.github/workflows/review-findings-gate.yaml
    with:
      reviewer-repository: ${{ github.repository }}
      # A caller in this repository passes its own `github.sha`, which under
      # pull_request_target is the base branch — trusted, and the same commit
      # this workflow file itself came from.
      reviewer-ref: ${{ github.sha }}
      status-context: Review findings resolved (parity)
      unreviewed-state: failure
